<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <meta charset="UTF-8">
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: "Google Sans", Arial, sans-serif;
      font-size: 13px;
      margin: 0;
      padding: 12px;
      color: #202124;
      background: #fff;
    }
    h3 { margin: 0 0 12px; font-size: 14px; }
    label { display: block; margin-bottom: 4px; font-weight: 500; }
    input[type="text"], input[type="url"] {
      width: 100%;
      padding: 6px 8px;
      border: 1px solid #dadce0;
      border-radius: 4px;
      font-size: 12px;
    }
    button {
      margin-top: 6px;
      padding: 6px 14px;
      background: #1a73e8;
      color: #fff;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-size: 12px;
    }
    button:disabled { background: #aaa; cursor: default; }
    .section { margin-bottom: 16px; }
    .row { display: flex; align-items: center; gap: 8px; }
    #blockSlider { flex: 1; }
    #blockDisplay { width: 72px; text-align: right; font-variant-numeric: tabular-nums; }
    #statusBar {
      padding: 6px 8px;
      border-radius: 4px;
      font-size: 11px;
      background: #f1f3f4;
      margin-top: 8px;
    }
    #statusBar.live   { background: #e6f4ea; color: #137333; }
    #statusBar.pinned { background: #fce8b2; color: #b06000; }
    #statusBar.fetching { background: #e8f0fe; color: #1a73e8; }
    #statusBar.error  { background: #fce8e6; color: #c5221f; }
    .divider { border: none; border-top: 1px solid #e0e0e0; margin: 12px 0; }
  </style>
</head>
<body>

<h3>sheets-on-chain</h3>

<!-- Backend URL -->
<div class="section">
  <label for="backendUrl">Backend URL</label>
  <input type="url" id="backendUrl" placeholder="https://your-backend.example.com">
  <button id="saveBtn">Save</button>
  <div id="urlWarning" style="display:none;margin-top:4px;font-size:11px;color:#b06000;">
    ⚠ Use <b>https://</b> — the sidebar is served over HTTPS so plain http:// and ws:// are blocked (mixed content).<br>
    For local dev: <code>ngrok http 3000</code> then paste the https:// URL.
  </div>
</div>

<hr class="divider">

<!-- Block control -->
<div class="section">
  <label>Block</label>
  <div class="row">
    <input type="range" id="blockSlider" min="1" max="99999999" value="1" step="1">
    <span id="blockDisplay">—</span>
  </div>
  <div class="row" style="margin-top:8px;">
    <input type="checkbox" id="liveCheck" checked>
    <label for="liveCheck" style="margin:0;font-weight:normal;">Latest (live)</label>
  </div>
</div>

<div id="statusBar">Idle</div>

<?!= include('Sidebar.js') ?>
</body>
</html>
